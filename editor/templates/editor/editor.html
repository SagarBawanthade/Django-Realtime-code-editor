<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Real-Time Code Editor</title>
  <link rel="stylesheet" data-name="vs/editor/editor.main" href="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.26.1/min/vs/editor/editor.main.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
      overflow: hidden;
    }

    /* Animated background particles */
    .bg-particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .particle {
      position: absolute;
      background: rgba(99, 102, 241, 0.1);
      border-radius: 50%;
      animation: float 20s infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) translateX(0); }
      25% { transform: translateY(-30px) translateX(20px); }
      50% { transform: translateY(-60px) translateX(-20px); }
      75% { transform: translateY(-30px) translateX(20px); }
    }

    /* Main container */
    .dashboard {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding: 20px;
      gap: 20px;
    }

    /* Header */
    .header {
      background: rgba(26, 31, 58, 0.8);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 20px 30px;
      border: 1px solid rgba(99, 102, 241, 0.2);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
      animation: slideDown 0.6s ease-out;
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      color: #fff;
      font-size: 24px;
      font-weight: 700;
    }

    .logo i {
      color: #6366f1;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }

    .header-controls {
      display: flex;
      gap: 15px;
      align-items: center;
      flex-wrap: wrap;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-radius: 8px;
      color: #10b981;
      font-size: 14px;
      transition: all 0.3s ease;
    }

    .status.connected .status-dot {
      background: #10b981;
      animation: blink 2s infinite;
    }

    .status.disconnected {
      background: rgba(239, 68, 68, 0.1);
      border-color: rgba(239, 68, 68, 0.3);
      color: #ef4444;
    }

    .status.disconnected .status-dot {
      background: #ef4444;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .language-selector {
      padding: 8px 16px;
      background: rgba(99, 102, 241, 0.1);
      border: 1px solid rgba(99, 102, 241, 0.3);
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.3s ease;
      outline: none;
    }

    .language-selector:hover {
      background: rgba(99, 102, 241, 0.2);
      border-color: rgba(99, 102, 241, 0.5);
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: rgba(99, 102, 241, 0.1);
      border: 1px solid rgba(99, 102, 241, 0.3);
      color: #6366f1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      font-size: 16px;
    }

    .icon-btn:hover {
      background: rgba(99, 102, 241, 0.2);
      border-color: rgba(99, 102, 241, 0.5);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
    }

    /* Editor container */
    .editor-wrapper {
      flex: 1;
      background: rgba(26, 31, 58, 0.8);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      border: 1px solid rgba(99, 102, 241, 0.2);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      animation: fadeIn 0.8s ease-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: scale(0.95);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .editor-header {
      padding: 15px 25px;
      background: rgba(15, 23, 42, 0.6);
      border-bottom: 1px solid rgba(99, 102, 241, 0.2);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .user-info {
  display: flex;
  align-items: center;
  gap: 8px;
  background: rgba(234, 234, 241, 0.1);
  border: 1px solid rgba(99, 102, 241, 0.3);
  border-radius: 8px;
  padding: 8px 14px;
  color: #fff;
  font-size: 14px;
}
.user-info i {
  color: #6366f1;
}


    .editor-tabs {
      display: flex;
      gap: 10px;
    }

    .tab {
      padding: 8px 16px;
      background: rgba(99, 102, 241, 0.1);
      border: 1px solid rgba(99, 102, 241, 0.2);
      border-radius: 8px;
      color: #94a3b8;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tab.active {
      background: rgba(99, 102, 241, 0.3);
      border-color: rgba(99, 102, 241, 0.5);
      color: #fff;
    }

    .tab:hover:not(.active) {
      background: rgba(99, 102, 241, 0.15);
    }

    .editor-info {
      display: flex;
      gap: 20px;
      color: #94a3b8;
      font-size: 12px;
    }

    .editor-info span {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    #editor-container {
      flex: 1;
      min-height: 0;
    }

    /* Footer */
    .footer {
      background: rgba(26, 31, 58, 0.8);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 15px 30px;
      border: 1px solid rgba(99, 102, 241, 0.2);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
      animation: slideUp 0.6s ease-out;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .footer-info {
      display: flex;
      gap: 20px;
      color: #94a3b8;
      font-size: 13px;
      flex-wrap: wrap;
    }

    .footer-info span {
      display: flex;
      align-items: center;
      gap: 6px;
    }


    #logout-btn:hover {
  background: rgba(239, 68, 68, 0.2);
  border-color: rgba(239, 68, 68, 0.4);
  color: #ef4444;
}

    .sync-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #94a3b8;
      font-size: 13px;
    }

    .sync-icon {
      animation: rotate 2s linear infinite;
    }

    .sync-icon.synced {
      animation: none;
      color: #10b981;
    }

    @keyframes rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* Responsive */
    @media (max-width: 768px) {
      .dashboard {
        padding: 10px;
        gap: 10px;
      }

      .header, .footer {
        padding: 15px 20px;
      }

      .logo {
        font-size: 20px;
      }

      .editor-info, .footer-info {
        display: none;
      }

      .header-controls {
        gap: 10px;
      }
    }

    /* Loading animation */
    .loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: #6366f1;
    }

    .loading i {
      font-size: 48px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /*DIalog Box for logout*/

.modal-overlay {

.modal-header {

.modal-icon {

.modal-title {

.modal-buttons {

.modal-btn {

}

.modal-btn-no {
  background: rgba(99, 102, 241, 0.1);
  border-color: rgba(99, 102, 241, 0.3);
  color: #6366f1;
}

.modal-btn-no:hover {
  background: rgba(99, 102, 241, 0.2);
  border-color: rgba(99, 102, 241, 0.5);
  transform: translateY(-1px);
}

.modal-btn-yes {
  background: rgba(239, 68, 68, 0.15);

.modal-btn-yes:hover {
  background: rgba(239, 68, 68, 0.25);
  border-color: rgba(239, 68, 68, 0.6);
  transform: translateY(-1px);
}


  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.26.1/min/vs/loader.min.js"></script>
  <script>

    function getCookie(name) {
  let cookieValue = null;
  if (document.cookie && document.cookie !== '') {
    const cookies = document.cookie.split(';');
    for (let i = 0; i < cookies.length; i++) {
      const cookie = cookies[i].trim();
      if (cookie.substring(0, name.length + 1) === (name + '=')) {
        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
        break;
      }
    }
  }
  return cookieValue;
}

const csrftoken = getCookie('csrftoken');

// Logout Modal Logic
  const logoutModal = document.getElementById('logoutModal');
  const logoutBtn = document.getElementById('logout-btn');
  const modalYesBtn = document.getElementById('modalYesBtn');
  const modalNoBtn = document.getElementById('modalNoBtn');

  logoutBtn.addEventListener('click', function() {
    logoutModal.classList.add('show');
  });

  modalNoBtn.addEventListener('click', function() {
    logoutModal.classList.remove('show');
  });

  logoutModal.addEventListener('click', function(e) {
    if (e.target === logoutModal) {
      logoutModal.classList.remove('show');
    }
  });

  modalYesBtn.addEventListener('click', function() {
    logoutModal.classList.remove('show');
    
    fetch('/editor/api/logout/', {
      method: 'GET',
      credentials: 'same-origin'
    })
    .then(response => {
      if (response.redirected) {
        window.location.href = response.url;
      } else {
        window.location.href = '/auth/login/';
      }
    })
    .catch(err => {
      console.error('Logout error:', err);
      alert('Something went wrong while logging out.');
    });
  });

  // Create animated background particles
  function createParticles() {
    const particlesContainer = document.getElementById('particles');
    for (let i = 0; i < 20; i++) {
      const particle = document.createElement('div');
      particle.className = 'particle';
      const size = Math.random() * 100 + 50;
      particle.style.width = size + 'px';
      particle.style.height = size + 'px';
      particle.style.left = Math.random() * 100 + '%';
      particle.style.top = Math.random() * 100 + '%';
      particle.style.animationDelay = Math.random() * 20 + 's';
      particle.style.animationDuration = (Math.random() * 10 + 15) + 's';
      particlesContainer.appendChild(particle);
    }
  }
  createParticles();

  const roomName = "{{ room_name|default:'demo' }}";
  const wsProtocol = window.location.protocol === 'https:' ? 'wss' : 'ws';
  let ws;
  let reconnectInterval;

  function connectWebSocket() {
    ws = new WebSocket(wsProtocol + '://' + window.location.host + '/ws/editor/' + roomName + '/');
    
    ws.onopen = function() {
      updateStatus(true);
      clearInterval(reconnectInterval);
    };

    ws.onerror = function() {
      updateStatus(false);
    };

    ws.onclose = function() {
      updateStatus(false);
      reconnectInterval = setInterval(connectWebSocket, 3000);
    };

    return ws;
  }

  function updateStatus(connected) {
    const status = document.getElementById('status');
    const statusText = document.getElementById('status-text');
    
    if (connected) {
      status.classList.remove('disconnected');
      status.classList.add('connected');
      statusText.textContent = 'Connected';
    } else {
      status.classList.remove('connected');
      status.classList.add('disconnected');
      statusText.textContent = 'Disconnected';
    }
  }

  connectWebSocket();
  
  // Configure Monaco Editor loader
  require.config({ paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.26.1/min/vs' }});
  let editor;
  let lastSavedContent = "";
  let saveTimeout;
  let isLoading = false;

  // Load Monaco Editor
  require(["vs/editor/editor.main"], function () {
    document.getElementById('loading').style.display = 'none';
    
    editor = monaco.editor.create(document.getElementById('editor-container'), {
      value: '',
      language: 'javascript',
      theme: 'vs-dark',
      automaticLayout: true,
      fontSize: 14,
      minimap: { enabled: true },
      scrollBeyondLastLine: false,
      roundedSelection: false,
      padding: { top: 20, bottom: 20 }
    });

    // LOAD SAVED CODE FROM DATABASE
    async function loadUserCode() {
      try {
        isLoading = true;
        console.log("Loading saved code from database...");
        
        const res = await fetch("/editor/api/load_code/");
        
        if (!res.ok) {
          throw new Error(`HTTP error! status: ${res.status}`);
        }
        
        const data = await res.json();
        const code = data.code || "";
        
        editor.setValue(code);
        lastSavedContent = code;
        
        console.log("Code loaded successfully:", code.substring(0, 50) + "...");
        updateSyncStatus('All changes saved');
        
      } catch (error) {
        console.error("Error loading code:", error);
        updateSyncStatus('Failed to load', true);
      } finally {
        isLoading = false;
      }
    }

    // SAVE CODE TO DATABASE
    async function saveUserCode(force = false) {
      const code = editor.getValue();
      
      // Don't save if content hasn't changed
      if (!force && code === lastSavedContent) {
        console.log("No changes to save");
        return;
      }

      // Don't save empty content on auto-save (but allow manual save)
      if (!force && code.trim() === "") {
        console.log("Skipping save - empty content");
        return;
      }

      try {
        console.log("Saving to database...");
        updateSyncStatus('Saving...', false, true);
        
        const res = await fetch("/editor/api/save_code/", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            filename: "main.js",
            code: code
          })
        });

        if (!res.ok) {
          throw new Error(`HTTP error! status: ${res.status}`);
        }

        const data = await res.json();
        lastSavedContent = code;
        
        console.log("Saved successfully");
        updateSyncStatus('All changes saved');
        
      } catch (error) {
        console.error("Save error:", error);
        updateSyncStatus('Save failed', true);
      }
    }

    // DEBOUNCED AUTO-SAVE (saves 1 second after user stops typing)
    function scheduleAutoSave() {
      clearTimeout(saveTimeout);
      updateSyncStatus('Unsaved changes...', false, true);
      
      saveTimeout = setTimeout(() => {
        saveUserCode(false);
      }, 1000); // Save 1 second after user stops typing
    }

    // Update sync status indicator
    function updateSyncStatus(message, isError = false, isSyncing = false) {
      const syncIcon = document.getElementById('sync-icon');
      const syncText = document.getElementById('sync-text');
      
      syncIcon.classList.remove('synced');
      
      if (isSyncing) {
        syncIcon.classList.remove('synced');
      } else if (!isError) {
        syncIcon.classList.add('synced');
      }
      
      syncText.textContent = message;
      syncText.style.color = isError ? '#ef4444' : '#94a3b8';
    }

    // Load code on page load
    loadUserCode();

    // AUTO-SAVE: Save periodically (every 3 seconds if there are changes)
    setInterval(() => {
      const code = editor.getValue();
      if (code !== lastSavedContent && code.trim() !== "") {
        saveUserCode(false);
      }
    }, 3000);

    // HANDLE WEBSOCKET MESSAGES (real-time collaboration)
    let isRemoteUpdate = false;

    ws.onmessage = function(event) {
      const incomingContent = event.data;

      // Ignore empty WebSocket messages
      if (!incomingContent || incomingContent.trim() === "") {
        console.log("Ignored empty WS message");
        return;
      }

      const currentContent = editor.getValue();

      if (incomingContent !== currentContent) {
        isRemoteUpdate = true;

        const position = editor.getPosition();
        editor.getModel().setValue(incomingContent);

        if (position) editor.setPosition(position);

        isRemoteUpdate = false;
        updateStats();
        
        // Save remote changes to database
        lastSavedContent = incomingContent;
        saveUserCode(true);
      }
    };

    // HANDLE EDITOR CONTENT CHANGES
    editor.onDidChangeModelContent(function() {
      updateStats();
      
      // Don't trigger auto-save or WebSocket for remote updates or during loading
      if (isRemoteUpdate || isLoading) {
        return;
      }

      // Send to WebSocket for real-time collaboration
      if (ws.readyState === WebSocket.OPEN) {
        const content = editor.getValue();
        if (content || content === "") { // Allow sending empty content via WS
          ws.send(content);
        }
      }

      // Schedule auto-save
      scheduleAutoSave();
    });

    // Update stats
    function updateStats() {
      const content = editor.getValue();
      const lines = editor.getModel().getLineCount();
      document.getElementById('char-count').innerHTML = 
        `<i class="fas fa-text-height"></i> ${content.length} characters`;
      document.getElementById('line-count').innerHTML = 
        `<i class="fas fa-align-left"></i> ${lines} ${lines === 1 ? 'line' : 'lines'}`;
    }

    // SAVE BEFORE UNLOAD
    window.addEventListener('beforeunload', function(e) {
      const code = editor.getValue();
      if (code !== lastSavedContent) {
        // Attempt synchronous save
        navigator.sendBeacon('/editor/api/save_code/', JSON.stringify({
          filename: "main.js",
          code: code
        }));
      }
    });

    // Download button
    document.getElementById('download-btn')?.addEventListener('click', function() {
      const content = editor.getValue();
      const blob = new Blob([content], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'code.txt';
      a.click();
      URL.revokeObjectURL(url);
    });

    // Settings button
    document.getElementById('settings-btn')?.addEventListener('click', function() {
      alert('Settings panel coming soon!');
    });

    updateStats();
  });
  </script>
</body>
</html>
