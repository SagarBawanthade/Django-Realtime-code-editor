<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Real-Time Code Editor</title>
  <link rel="stylesheet" data-name="vs/editor/editor.main" href="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.26.1/min/vs/editor/editor.main.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
      overflow: hidden;
    }

    .bg-particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .particle {
      position: absolute;
      background: rgba(99, 102, 241, 0.1);
      border-radius: 50%;
      animation: float 20s infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) translateX(0); }
      25% { transform: translateY(-30px) translateX(20px); }
      50% { transform: translateY(-60px) translateX(-20px); }
      75% { transform: translateY(-30px) translateX(20px); }
    }

    .dashboard {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding: 20px;
      gap: 20px;
    }

    .header {
      background: rgba(26, 31, 58, 0.8);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 20px 30px;
      border: 1px solid rgba(99, 102, 241, 0.2);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
      animation: slideDown 0.6s ease-out;
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      color: #fff;
      font-size: 24px;
      font-weight: 700;
    }

    .logo i {
      color: #6366f1;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }

    .header-controls {
      display: flex;
      gap: 15px;
      align-items: center;
      flex-wrap: wrap;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-radius: 8px;
      color: #10b981;
      font-size: 14px;
      transition: all 0.3s ease;
    }

    .status.connected .status-dot {
      background: #10b981;
      animation: blink 2s infinite;
    }

    .status.disconnected {
      background: rgba(239, 68, 68, 0.1);
      border-color: rgba(239, 68, 68, 0.3);
      color: #ef4444;
    }

    .status.disconnected .status-dot {
      background: #ef4444;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* ✅ LANGUAGE SELECTOR STYLES */
    .language-selector {
      padding: 8px 16px;
      background: rgba(99, 102, 241, 0.1);
      border: 1px solid rgba(99, 102, 241, 0.3);
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.3s ease;
      outline: none;
      min-width: 140px;
    }

    .language-selector:hover {
      background: rgba(99, 102, 241, 0.2);
      border-color: rgba(99, 102, 241, 0.5);
    }

    .language-selector option {
      background: #1a1f3a;
      color: #fff;
      padding: 8px;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(234, 234, 241, 0.1);
      border: 1px solid rgba(99, 102, 241, 0.3);
      border-radius: 8px;
      padding: 8px 14px;
      color: #fff;
      font-size: 14px;
    }

    .user-info i {
      color: #6366f1;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: rgba(99, 102, 241, 0.1);
      border: 1px solid rgba(99, 102, 241, 0.3);
      color: #6366f1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      font-size: 16px;
    }

    .icon-btn:hover {
      background: rgba(99, 102, 241, 0.2);
      border-color: rgba(99, 102, 241, 0.5);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
    }

    #logout-btn:hover {
      background: rgba(239, 68, 68, 0.2);
      border-color: rgba(239, 68, 68, 0.4);
      color: #ef4444;
    }

    .editor-wrapper {
      flex: 1;
      background: rgba(26, 31, 58, 0.8);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      border: 1px solid rgba(99, 102, 241, 0.2);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      animation: fadeIn 0.8s ease-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: scale(0.95);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .editor-header {
      padding: 15px 25px;
      background: rgba(15, 23, 42, 0.6);
      border-bottom: 1px solid rgba(99, 102, 241, 0.2);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .editor-tabs {
      display: flex;
      gap: 10px;
    }

    .tab {
      padding: 8px 16px;
      background: rgba(99, 102, 241, 0.1);
      border: 1px solid rgba(99, 102, 241, 0.2);
      border-radius: 8px;
      color: #94a3b8;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tab.active {
      background: rgba(99, 102, 241, 0.3);
      border-color: rgba(99, 102, 241, 0.5);
      color: #fff;
    }

    .tab:hover:not(.active) {
      background: rgba(99, 102, 241, 0.15);
    }

    .editor-info {
      display: flex;
      gap: 20px;
      color: #94a3b8;
      font-size: 12px;
    }

    .editor-info span {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    #editor-container {
      flex: 1;
      min-height: 0;
    }

    .run-btn {
      background: rgba(16, 185, 129, 0.1);
      border-color: rgba(16, 185, 129, 0.3);
      color: #10b981;
    }

    .run-btn:hover {
      background: rgba(16, 185, 129, 0.2);
      border-color: rgba(16, 185, 129, 0.5);
    }

    .run-btn.running {
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .output-panel {
      height: 200px;
      background: rgba(15, 23, 42, 0.9);
      border-top: 1px solid rgba(99, 102, 241, 0.2);
      padding: 15px;
      overflow-y: auto;
      font-family: var(--monaco-monospace-font);
      font-size: 13px;
      color: #94a3b8;
      display: none;
    }

    .output-panel.show {
      display: block;
    }

    .output-panel .output-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(99, 102, 241, 0.2);
    }

    .output-panel .output-content {
      white-space: pre-wrap;
      color: #e2e8f0;
    }

    .output-panel .output-error {
      color: #ef4444;
    }

    .output-panel .output-success {
      color: #10b981;
    }

    .footer {
      background: rgba(26, 31, 58, 0.8);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 15px 30px;
      border: 1px solid rgba(99, 102, 241, 0.2);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
      animation: slideUp 0.6s ease-out;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .footer-info {
      display: flex;
      gap: 20px;
      color: #94a3b8;
      font-size: 13px;
      flex-wrap: wrap;
    }

    .footer-info span {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .sync-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #94a3b8;
      font-size: 13px;
    }

    .sync-icon {
      animation: rotate 2s linear infinite;
    }

    .sync-icon.synced {
      animation: none;
      color: #10b981;
    }

    @keyframes rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: #6366f1;
    }

    .loading i {
      font-size: 48px;
      animation: spin 1s linear infinite;
    }

    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(5px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      animation: fadeIn 0.3s ease;
    }

    .modal-overlay.show {
      display: flex;
    }

    .modal-dialog {
      background: linear-gradient(135deg, rgba(26, 31, 58, 0.95) 0%, rgba(15, 23, 42, 0.95) 100%);
      border: 1px solid rgba(99, 102, 241, 0.3);
      border-radius: 16px;
      padding: 30px;
      max-width: 400px;
      width: 90%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-20px) scale(0.95);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .modal-header {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
    }

    .modal-icon {
      width: 50px;
      height: 50px;
      border-radius: 12px;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      color: #ef4444;
    }

    .modal-title {
      color: #fff;
      font-size: 22px;
      font-weight: 600;
    }

    .modal-message {
      color: #94a3b8;
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    .modal-buttons {
      display: flex;
      gap: 12px;
      justify-content: flex-end;
    }

    .modal-btn {
      padding: 10px 24px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
      border: 1px solid;
      outline: none;
    }

    .modal-btn-no {
      background: rgba(99, 102, 241, 0.1);
      border-color: rgba(99, 102, 241, 0.3);
      color: #6366f1;
    }

    .modal-btn-no:hover {
      background: rgba(99, 102, 241, 0.2);
      border-color: rgba(99, 102, 241, 0.5);
      transform: translateY(-1px);
    }

    .modal-btn-yes {
      background: rgba(239, 68, 68, 0.15);
      border-color: rgba(239, 68, 68, 0.4);
      color: #ef4444;
    }

    .modal-btn-yes:hover {
      background: rgba(239, 68, 68, 0.25);
      border-color: rgba(239, 68, 68, 0.6);
      transform: translateY(-1px);
    }

    .remote-cursor {
      position: absolute;
      border-left: 3px solid #6366f1 !important;
      z-index: 50;
      pointer-events: none;
      box-shadow: 0 0 8px rgba(99, 102, 241, 0.6);
      animation: cursorBlink 1.5s ease-in-out infinite;
    }

    @keyframes cursorBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }

    @media (max-width: 768px) {
      .dashboard {
        padding: 10px;
        gap: 10px;
      }

      .header, .footer {
        padding: 15px 20px;
      }

      .logo {
        font-size: 20px;
      }

      .editor-info, .footer-info {
        display: none;
      }

      .header-controls {
        gap: 10px;
      }
    }
  </style>
</head>
<body>
  <div class="modal-overlay" id="logoutModal">
    <div class="modal-dialog">
      <div class="modal-header">
        <div class="modal-icon">
          <i class="fas fa-sign-out-alt"></i>
        </div>
        <div class="modal-title">Confirm Logout</div>
      </div>
      <div class="modal-message">
        Are you sure you want to logout? Any unsaved changes will be lost.
      </div>
      <div class="modal-buttons">
        <button class="modal-btn modal-btn-no" id="modalNoBtn">No</button>
        <button class="modal-btn modal-btn-yes" id="modalYesBtn">Yes, Logout</button>
      </div>
    </div>
  </div>

  <div class="bg-particles" id="particles"></div>

  <div class="dashboard">
    <div class="header">
      <div class="logo">
        <i class="fas fa-code"></i>
        <span>Real-Time Code Editor</span>
      </div>
      
      <div class="header-controls">
        <div class="status connected" id="status">
          <span class="status-dot"></span>
          <span id="status-text">Connected</span>
        </div>

        <!-- ✅ LANGUAGE SELECTOR ADDED -->
        <select class="language-selector" id="language-selector">
          <option value="javascript">JavaScript</option>
          <option value="python">Python</option>
          <option value="java">Java</option>
          <option value="cpp">C++</option>
          <option value="c">C</option>
          <option value="csharp">C#</option>
          <option value="typescript">TypeScript</option>
          <option value="php">PHP</option>
          <option value="ruby">Ruby</option>
          <option value="go">Go</option>
          <option value="rust">Rust</option>
          <option value="kotlin">Kotlin</option>
          <option value="swift">Swift</option>
          <option value="r">R</option>
          <option value="perl">Perl</option>
          <option value="lua">Lua</option>
          <option value="sql">SQL</option>
          <option value="bash">Bash</option>
        </select>

        <div class="user-info">
          <i class="fas fa-user"></i>
          <span>{{ username }}</span>
        </div>

        <button class="icon-btn" title="Logout" id="logout-btn">
          <i class="fas fa-sign-out-alt"></i>
        </button>
      </div>
    </div>

    <div class="editor-wrapper">
      <div class="editor-header">
        <div class="editor-tabs">
          <!-- ✅ TAB WITH DYNAMIC FILE NAME -->
          <div class="tab active" id="file-tab">
            <i class="fas fa-file-code"></i>
            <span id="file-name">main.js</span>
          </div>
        </div>
        
        <div class="editor-info">
          <span><i class="fas fa-users"></i> 1 active</span>
          <span><i class="fas fa-clock"></i> Auto-save</span>
        </div>

        <button class="icon-btn run-btn" title="Run Code" id="run-btn">
          <i class="fas fa-play"></i> 
        </button>
      </div>
      
      <div id="editor-container">
        <div class="loading" id="loading">
          <i class="fas fa-spinner"></i>
          <p>Loading editor...</p>
        </div>
      </div>

      <div class="output-panel" id="output-panel">
        <div class="output-header">
          <span><i class="fas fa-terminal"></i> Output</span>
          <button class="icon-btn" id="close-output" style="width: 24px; height: 24px;">
            <i class="fas fa-times"></i>
          </button>
        </div>
        <div class="output-content" id="output-content">
          Click "Run" to execute your code...
        </div>
      </div>
    </div>

    <div class="footer">
      <div class="footer-info">
        <span><i class="fas fa-server"></i> Room: <strong>demo</strong></span>
        <span><i class="fas fa-code-branch"></i> UTF-8</span>
        <span id="char-count"><i class="fas fa-text-height"></i> 0 characters</span>
        <span id="line-count"><i class="fas fa-align-left"></i> 1 line</span>
      </div>
      
      <div class="sync-indicator">
        <i class="fas fa-sync-alt sync-icon synced" id="sync-icon"></i>
        <span id="sync-text">All changes saved</span>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.26.1/min/vs/loader.min.js"></script>
  <script>

        fileName: 'main.sh'
      }
    };

    let currentLanguage = 'javascript';

    function getCookie(name) {
      let cookieValue = null;
      if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
          const cookie = cookies[i].trim();
          if (cookie.substring(0, name.length + 1) === (name + '=')) {
            cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
            break;
          }
        }
      }
      return cookieValue;
    }

    const csrftoken = getCookie('csrftoken');

    const logoutModal = document.getElementById('logoutModal');
    const logoutBtn = document.getElementById('logout-btn');
    const modalYesBtn = document.getElementById('modalYesBtn');
    const modalNoBtn = document.getElementById('modalNoBtn');

    logoutBtn.addEventListener('click', function() {
      logoutModal.classList.add('show');
    });

    modalNoBtn.addEventListener('click', function() {
      logoutModal.classList.remove('show');
    });

    logoutModal.addEventListener('click', function(e) {
      if (e.target === logoutModal) {
        logoutModal.classList.remove('show');
      }
    });

    modalYesBtn.addEventListener('click', function() {
      logoutModal.classList.remove('show');
      
      fetch('/editor/api/logout/', {
        method: 'GET',
        credentials: 'same-origin'
      })
      .then(response => {
        if (response.redirected) {
          window.location.href = response.url;
        } else {
          window.location.href = '/auth/login/';
        }
      })
      .catch(err => {
        console.error('Logout error:', err);
        alert('Something went wrong while logging out.');
      });
    });

    function createParticles() {
      const particlesContainer = document.getElementById('particles');
      for (let i = 0; i < 20; i++) {
        const particle = document.createElement('div');
        particle.className = 'particle';
        const size = Math.random() * 100 + 50;
        particle.style.width = size + 'px';
        particle.style.height = size + 'px';
        particle.style.left = Math.random() * 100 + '%';
        particle.style.top = Math.random() * 100 + '%';
        particle.style.animationDelay = Math.random() * 20 + 's';
        particle.style.animationDuration = (Math.random() * 10 + 15) + 's';
        particlesContainer.appendChild(particle);
      }
    }
    createParticles();

    const roomName = "{{ room_name|default:'demo' }}";
    const wsProtocol = window.location.protocol === 'https:' ? 'wss' : 'ws';
    let ws;
    let reconnectInterval;

    function connectWebSocket() {
      ws = new WebSocket(wsProtocol + '://' + window.location.host + '/ws/editor/' + roomName + '/');
      
      ws.onopen = function() {
        updateStatus(true);
        clearInterval(reconnectInterval);
      };

      ws.onerror = function() {
        updateStatus(false);
      };

      ws.onclose = function() {
        updateStatus(false);
        reconnectInterval = setInterval(connectWebSocket, 3000);
      };

      return ws;
    }

    function updateStatus(connected) {
      const status = document.getElementById('status');
      const statusText = document.getElementById('status-text');
      
      if (connected) {
        status.classList.remove('disconnected');
        status.classList.add('connected');
        statusText.textContent = 'Connected';
      } else {
        status.classList.remove('connected');
        status.classList.add('disconnected');
        statusText.textContent = 'Disconnected';
      }
    }

    connectWebSocket();
    
    require.config({ paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.26.1/min/vs' }});
    let editor;
    let lastSavedContent = "";
    let saveTimeout;
    let isLoading = false;

    require(["vs/editor/editor.main"], function () {
      document.getElementById('loading').style.display = 'none';
      
      editor = monaco.editor.create(document.getElementById('editor-container'), {
        value: '',
        language: 'javascript',
        theme: 'vs-dark',
        automaticLayout: true,
        fontSize: 14,
        minimap: { enabled: true },
        scrollBeyondLastLine: false,
        roundedSelection: false,
        padding: { top: 20, bottom: 20 }
      });

      // ✅ LANGUAGE SELECTOR CHANGE EVENT
      const languageSelector = document.getElementById('language-selector');
      languageSelector.addEventListener('change', function() {
        const selectedLang = this.value;
        currentLanguage = selectedLang;
        
        const config = LANGUAGE_CONFIG[selectedLang];
        
        // Update Monaco editor language
        monaco.editor.setModelLanguage(editor.getModel(), config.monacoLang);
        
        // Update file name in tab
        document.getElementById('file-name').textContent = config.fileName;
        
        console.log(`Language changed to: ${selectedLang} (${config.fileName})`);
      });

      async function loadUserCode() {
        try {
          isLoading = true;
          console.log("Loading saved code from database...");
          
          const res = await fetch("/editor/api/load_code/");
          
          if (!res.ok) {
            throw new Error(`HTTP error! status: ${res.status}`);
          }
          
          const data = await res.json();
          const code = data.code || "";
          
          editor.setValue(code);
          lastSavedContent = code;
          
          console.log("Code loaded successfully");
          updateSyncStatus('All changes saved');
          
        } catch (error) {
          console.error("Error loading code:", error);
          updateSyncStatus('Failed to load', true);
        } finally {
          isLoading = false;
        }
      }

      async function saveUserCode(force = false) {
        const code = editor.getValue();
        
        if (!force && code === lastSavedContent) {
          console.log("No changes to save");
          return;
        }

        if (!force && code.trim() === "") {
          console.log("Skipping save - empty content");
          return;
        }

        try {
          console.log("Saving to database...");
          updateSyncStatus('Saving...', false, true);
          
          const res = await fetch("/editor/api/save_code/", {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              filename: LANGUAGE_CONFIG[currentLanguage].fileName,
              code: code
            })
          });

          if (!res.ok) {
            throw new Error(`HTTP error! status: ${res.status}`);
          }

          const data = await res.json();
          lastSavedContent = code;
          
          console.log("Saved successfully");
          updateSyncStatus('All changes saved');
          
        } catch (error) {
          console.error("Save error:", error);
          updateSyncStatus('Save failed', true);
        }
      }

      function scheduleAutoSave() {
        clearTimeout(saveTimeout);
        updateSyncStatus('Unsaved changes...', false, true);
        
        saveTimeout = setTimeout(() => {
          saveUserCode(false);
        }, 1000);
      }

      function updateSyncStatus(message, isError = false, isSyncing = false) {
        const syncIcon = document.getElementById('sync-icon');
        const syncText = document.getElementById('sync-text');
        
        syncIcon.classList.remove('synced');
        
        if (isSyncing) {
          syncIcon.classList.remove('synced');
        } else if (!isError) {
          syncIcon.classList.add('synced');
        }
        
        syncText.textContent = message;
        syncText.style.color = isError ? '#ef4444' : '#94a3b8';
      }

      loadUserCode();

      setInterval(() => {
        const code = editor.getValue();
        if (code !== lastSavedContent && code.trim() !== "") {
          saveUserCode(false);
        }
      }, 3000);

      let isRemoteUpdate = false;

      ws.onmessage = function(event) {
        const data = JSON.parse(event.data);

        if (data.text !== undefined) {
          const incomingContent = data.text;

          if (incomingContent === editor.getValue()) {
            return;
          }

          isRemoteUpdate = true;
          const position = editor.getPosition();
          editor.getModel().setValue(incomingContent);
          if (position) editor.setPosition(position);
          isRemoteUpdate = false;
          
          updateStats();
          lastSavedContent = incomingContent;
          saveUserCode(true);
        }

        if (data.cursor && data.username && data.username !== "{{ username }}") {
          showRemoteCursor(data.cursor, data.username);
        }
      };

      function showRemoteCursor(cursor, username) {
        if (window.remoteCursorDecoration) {
          editor.deltaDecorations(window.remoteCursorDecoration, []);
        }
        
        window.remoteCursorDecoration = editor.deltaDecorations([], [
          {
            range: new monaco.Range(cursor.lineNumber, cursor.column, cursor.lineNumber, cursor.column),
            options: {
              className: 'remote-cursor',
              hoverMessage: { value: `${username} is typing…` },
              afterContentClassName: 'remote-cursor-label-' + username.replace(/\W/g,""),
            }
          }
        ]);

        const css = `
          .monaco-editor .remote-cursor-label-${username.replace(/\W/g,"")}::after {
            content: "${username}";
            position: absolute;
            left: 5px;
            top: -22px;
            color: #fff;
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 600;
            z-index: 90;
            opacity: 0.95;
            box-shadow: 0 2px 8px rgba(99, 102, 241, 0.4);
            white-space: nowrap;
            animation: labelFadeIn 0.3s ease-out;
          }
          
          @keyframes labelFadeIn {
            from {
              opacity: 0;
              transform: translateY(-5px);
            }
            to {
              opacity: 0.95;
              transform: translateY(0);
            }
          }
        `;

        let styleTag = document.getElementById('remote-cursor-style-' + username.replace(/\W/g,""));
        if (styleTag) styleTag.remove();
        styleTag = document.createElement('style');
        styleTag.id = 'remote-cursor-style-' + username.replace(/\W/g,"");
        styleTag.textContent = css;
        document.head.appendChild(styleTag);
      }

      // ✅ RUN CODE WITH DYNAMIC LANGUAGE SUPPORT
      const runBtn = document.getElementById('run-btn');
      const outputPanel = document.getElementById('output-panel');
      const outputContent = document.getElementById('output-content');
      const closeOutputBtn = document.getElementById('close-output');

      async function runCode() {
        const code = editor.getValue();
        
        if (!code || code.trim() === '') {
          outputContent.innerHTML = '<span class="output-error">Error: No code to run</span>';
          outputPanel.classList.add('show');
          return;
        }

        const config = LANGUAGE_CONFIG[currentLanguage];

        runBtn.classList.add('running');
        outputPanel.classList.add('show');
        outputContent.innerHTML = `<span style="color: #6366f1;">Running ${currentLanguage}...</span>`;

        try {
          const response = await fetch('https://emkc.org/api/v2/piston/execute', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({
              language: config.pistonLang,
              version: config.version,
              files: [{
                name: config.fileName,
                content: code
              }]
            })
          });

          const result = await response.json();
          
          if (result.run) {
            const output = result.run.output || result.run.stdout || '';
            const stderr = result.run.stderr || '';
            const exitCode = result.run.code;

            let outputHTML = '';
            
            if (stderr) {
              outputHTML += `<span class="output-error">${escapeHtml(stderr)}</span>\n`;
            }
            
            if (output) {
              outputHTML += `<span>${escapeHtml(output)}</span>\n`;
            }
            
            if (exitCode === 0) {
              outputHTML += `<span class="output-success">✓ Exited with code ${exitCode}</span>`;
            } else {
              outputHTML += `<span class="output-error">✗ Exited with code ${exitCode}</span>`;
            }
            
            outputContent.innerHTML = outputHTML || '<span class="output-error">No output</span>';
          } else {
            outputContent.innerHTML = '<span class="output-error">Error: Failed to execute code</span>';
          }

        } catch (error) {
          console.error('Execution error:', error);
          outputContent.innerHTML = `<span class="output-error">Error: ${escapeHtml(error.message)}</span>`;
        } finally {
          runBtn.classList.remove('running');
        }
      }

      function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
      }

      runBtn.addEventListener('click', runCode);

      closeOutputBtn.addEventListener('click', function() {
        outputPanel.classList.remove('show');
      });

      editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.Enter, function() {
        runCode();
      });

      editor.onDidChangeModelContent(function() {
        updateStats();
        
        if (isRemoteUpdate || isLoading) {
          return;
        }

        if (ws.readyState === WebSocket.OPEN) {
          const content = editor.getValue();
          const position = editor.getPosition();
          ws.send(JSON.stringify({
            text: content,
            cursor: position,
            username: "{{ username }}",
          }));
        }

        scheduleAutoSave();
      });

      function updateStats() {
        const content = editor.getValue();
        const lines = editor.getModel().getLineCount();
        document.getElementById('char-count').innerHTML = 
          `<i class="fas fa-text-height"></i> ${content.length} characters`;
        document.getElementById('line-count').innerHTML = 
          `<i class="fas fa-align-left"></i> ${lines} ${lines === 1 ? 'line' : 'lines'}`;
      }

      window.addEventListener('beforeunload', function(e) {
        const code = editor.getValue();
        if (code !== lastSavedContent) {
          navigator.sendBeacon('/editor/api/save_code/', JSON.stringify({
            filename: LANGUAGE_CONFIG[currentLanguage].fileName,
            code: code
          }));
        }
      });

      updateStats();
    });
  </script>
</body>
</html>
